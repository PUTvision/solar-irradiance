# path to original working directory
# hydra hijacks working directory by changing it to the current log directory,
# so it's useful to have this path as a special variable
# https://hydra.cc/docs/next/tutorials/basic/running_your_app/working_directory
work_dir: ${hydra:runtime.cwd}

# seed for random number generators in pytorch, numpy and python.random
seed: 42

#### MODE ####
debug: True
test_only: False

restore_from_ckpt:

export:
  export_to_onnx: False
  opset: 15
  use_simplifier: False

#### TRAINER ####
trainer:
  devices: 1
  precision: 32
  max_epochs: 1000

#### MODEL ####
model:
  model_name: resnet10t
  input_channels: 4
  loss_function: MAE
  lr: 3e-4
  lr_patience: 5

#### CALLBACKS ####
callbacks:
  model_checkpoint:
    monitor: "val_loss" # name of the logged metric which determines when model is improving
    mode: "min" # can be "max" or "min"
    save_top_k: 1 # save k best models (determined by above metric)
    save_last: False # additionally, always save model from last epoch
    verbose: True
    dirpath: "checkpoints/"
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: False
  early_stopping:
    monitor: "val_loss" # name of the logged metric which determines when model is improving
    mode: "min" # can be "max" or "min"
    patience: 10 # how many validation epochs of not improving until training stops
    min_delta: 0 # minimum change in the monitored metric needed to qualify as an improvement

#### DATA ####
datamodule:
  data_path: ${work_dir}/data/Folsom
  augment: True
  image_size: [384, 384]
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  batch_size: 128
  workers: 12
  number_of_splits: 5
  current_split: 0
  sun_mask: False
  cloud_mask: True
  cloud_mask_method: "blue_red_difference"
  blur_mask: False
