schema: '2.0'
stages:
  clean_dataframe:
    cmd: python scripts/prepare_dataframe.py --data-root data/Folsom --output-path
      data/Prepared/cleaned_irradiance.csv
    deps:
    - path: data/Folsom
      hash: md5
      md5: 1a067740695b101faef4ac7b7a6c721b.dir
      size: 64100647697
      nfiles: 775917
    - path: scripts/prepare_dataframe.py
      hash: md5
      md5: 2cfa55794fd4246ccbc565be563b820a
      size: 863
    outs:
    - path: data/Prepared/cleaned_irradiance.csv
      hash: md5
      md5: c44050c13a72e38ad3fed9d255870f0f
      size: 14883320
  export_periods:
    cmd: python scripts/export_folsom.py --cleaned-dataframe-path data/Prepared/cleaned_irradiance.csv
      --time-window 15 --history-size 3 --output-path data/Prepared/periods.pickle
    deps:
    - path: data/Prepared/cleaned_irradiance.csv
      hash: md5
      md5: c44050c13a72e38ad3fed9d255870f0f
      size: 14883320
    - path: scripts/export_folsom.py
      hash: md5
      md5: 2c2abc9b2ace28a01a975f250df2fe60
      size: 2023
    params:
      params.yaml:
        export_periods.history_size: 3
        export_periods.time_window: 15
    outs:
    - path: data/Prepared/periods.pickle
      hash: md5
      md5: 036a030ad1c057517cc40f5056b035d7
      size: 7965007
  train_forecaster:
    cmd: python scripts/train_forecaster.py --data-root data/Folsom --periods-path
      data/Prepared/periods.pickle
    deps:
    - path: data/Folsom
      hash: md5
      md5: 1a067740695b101faef4ac7b7a6c721b.dir
      size: 64100647697
      nfiles: 775917
    - path: data/Prepared/periods.pickle
      hash: md5
      md5: 036a030ad1c057517cc40f5056b035d7
      size: 7965007
    - path: scripts/train_forecaster.py
      hash: md5
      md5: 05eafd54576bfa78bf27a628fba79538
      size: 5023
    - path: src/solar_irradiance/models/forecaster.py
      hash: md5
      md5: fc1305b52d0315f1015ae9c2acd4dd53
      size: 6082
    params:
      params.yaml:
        train_forecaster:
          script_path: scripts/train_forecaster.py
          seed: 42
          debug: false
          test_only: false
          restore_from_ckpt:
          export:
            export_to_onnx: false
            opset: 15
            use_simplifier: false
          trainer:
            devices: 1
            precision: 32
            max_epochs: 1000
          model:
            model_name: r3d_18
            input_channels: 4
            loss_function: MAE
            lr: 0.0003
            lr_patience: 5
          callbacks:
            model_checkpoint:
              monitor: val_MeanAbsolutePercentageError
              mode: min
              save_top_k: 1
              save_last: false
              verbose: true
              dirpath: checkpoints/
              filename: epoch_{epoch:03d}
              auto_insert_metric_name: false
            early_stopping:
              monitor: val_MeanAbsolutePercentageError
              mode: min
              patience: 20
              min_delta: 0
          datamodule:
            augment: false
            image_size:
            - 384
            - 384
            image_mean:
            - 0.43216
            - 0.394666
            - 0.3764
            image_std:
            - 0.22803
            - 0.22145
            - 0.21698
            batch_size: 16
            workers: 6
            sun_mask: false
            blur_mask: false
            add_irradiance_channel: true
