              mode: min
              save_top_k: 1
              save_last: false
              verbose: true
              dirpath: checkpoints/
              filename: epoch_{epoch:03d}
              auto_insert_metric_name: false
            early_stopping:
              monitor: val_MeanAbsolutePercentageError
              mode: min
              patience: 20
              min_delta: 0
          datamodule:
            augment: false
            image_size:
            - 384
            - 384
            image_mean:
            - 0.43216
            - 0.394666
            - 0.3764
            image_std:
            - 0.22803
            - 0.22145
            - 0.21698
            batch_size: 16
            workers: 6
            add_sun_mask: false
            add_irradiance_channel: true
