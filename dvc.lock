schema: '2.0'
stages:
  clean_dataframe:
    cmd: python scripts/prepare_dataframe.py --data-root data/Folsom --output-path
      data/Prepared/cleaned_irradiance.csv
    deps:
    - path: data/Folsom
      hash: md5
      md5: 4020dc5f8fe0b4836d5f2224dadd0760.dir
      size: 64097965386
      nfiles: 775882
    - path: scripts/prepare_dataframe.py
      hash: md5
      md5: 2cfa55794fd4246ccbc565be563b820a
      size: 863
    outs:
    - path: data/Prepared/cleaned_irradiance.csv
      hash: md5
      md5: 62cd9b98fec4bfd41b984cb0fe38e918
      size: 40520514
  export_periods:
    cmd: python scripts/export_folsom.py --cleaned-dataframe-path data/Prepared/cleaned_irradiance.csv
      --time-window 15 --history-size 4 --output-path data/Prepared/periods.pickle
    deps:
    - path: data/Prepared/cleaned_irradiance.csv
      hash: md5
      md5: 62cd9b98fec4bfd41b984cb0fe38e918
      size: 40520514
    - path: scripts/export_folsom.py
      hash: md5
      md5: 779b3c0ba7e8e794a017a2c91044e775
      size: 1807
    params:
      params.yaml:
        export_periods.history_size: 4
        export_periods.time_window: 15
    outs:
    - path: data/Prepared/periods.pickle
      hash: md5
      md5: 9cb4a15a92b9df933eab4c178af6f420
      size: 126987636
  train_forecaster:
    cmd: python scripts/train_forecaster.py --data-root data/Folsom --periods-path
      data/Prepared/periods.pickle
    deps:
    - path: data/Folsom
      hash: md5
      md5: 1a067740695b101faef4ac7b7a6c721b.dir
      size: 64100647697
      nfiles: 775917
    - path: data/Prepared/periods.pickle
      hash: md5
      md5: 036a030ad1c057517cc40f5056b035d7
      size: 7965007
    - path: scripts/train_forecaster.py
      hash: md5
      md5: 05eafd54576bfa78bf27a628fba79538
      size: 5023
    - path: src/solar_irradiance/models/forecaster.py
      hash: md5
      md5: fc1305b52d0315f1015ae9c2acd4dd53
      size: 6082
    params:
      params.yaml:
        train_forecaster:
          script_path: scripts/train_forecaster.py
          seed: 42
          debug: false
          test_only: false
          restore_from_ckpt:
          export:
            export_to_onnx: false
            opset: 15
            use_simplifier: false
          trainer:
            devices: 1
            precision: 32
            max_epochs: 1000
          model:
            model_name: r3d_18
            input_channels: 4
            loss_function: MAE
            lr: 0.0003
            lr_patience: 5
          callbacks:
            model_checkpoint:
              monitor: val_MeanAbsolutePercentageError
              mode: min
              save_top_k: 1
              save_last: false
              verbose: true
              dirpath: checkpoints/
              filename: epoch_{epoch:03d}
              auto_insert_metric_name: false
            early_stopping:
              monitor: val_MeanAbsolutePercentageError
              mode: min
              patience: 20
              min_delta: 0
          datamodule:
            augment: false
            image_size:
            - 384
            - 384
            image_mean:
            - 0.43216
            - 0.394666
            - 0.3764
            image_std:
            - 0.22803
            - 0.22145
            - 0.21698
            batch_size: 16
            workers: 6
            add_sun_mask: false
            add_irradiance_channel: true
  export_eval_periods:
    cmd: python scripts/export_eval_periods.py --periods_path data/Prepared/periods.pickle
      --data_root data/Folsom --output_path data/Eval
    deps:
    - path: data/Folsom
      hash: md5
      md5: 1a067740695b101faef4ac7b7a6c721b.dir
      size: 64100647697
      nfiles: 775917
    - path: data/Prepared/periods.pickle
      hash: md5
      md5: ab55d2ce456144bae9c846b24eb19f7d
      size: 7629468
    outs:
    - path: data/Eval
      hash: md5
      md5: 3d18746ef1cbf3079ecd7c0041aa2361.dir
      size: 120850958
      nfiles: 1519
