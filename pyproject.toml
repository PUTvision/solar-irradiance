[project]
name = "solar_irradiance"
version = "0.1.0"
description = "Bag of tricks for ground-based solar irradiance forecasting using sky images."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mateusz Piechocki", email = "mateusz.piechocki@put.poznan.pl"},
]
keywords = ["python", "solar irradiance", "forecasting", "sky-images", "computer vision"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click==8.1.5",
    "numpy==1.26.4",
    "opencv-contrib-python==4.10.0.84",
    "pandas==2.2.3",
    "pvlib==0.10.1",
    "tqdm==4.65.0",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.1",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "ruff==0.12.0",
    "pre-commit==4.2.0",
]
dev = [
    "solar_irradiance[test]",
    # --------- pytorch --------- #
    "torch==2.5.1",
    "torchvision==0.20.1",
    "lightning==2.5.0",
    "torchmetrics==1.6.1",
    # --------- loggers --------- #
    "neptune<1.3",
    # --------- dvc --------- #
    "dvc[s3]==3.5.1",
    # --------- misc --------- #
    "albumentations==1.4.24",
    "python-dotenv==1.0.0",
    "timm==1.0.12",
    "transformers==4.47.1",
    # ----- model export ----- #
    "onnx==1.17.0",
    "onnxsim==0.4.33",
]
inference = [
    # --------- inference --------- #
    # "onnxruntimei-gpu==1.17.0", # build from source for specific hardware
    # --------- misc --------- #
    "Pillow==10.0.0",
]

[project.urls]
Homepage = "https://putvision.github.io"
Repository = "https://github.com/PUTvision/solar-irradiance"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["solar_irradiance*"]
exclude = ["tests*", "scripts*", "notebooks*"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 127
indent-width = 4

exclude = [
    "notebooks/*",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = [
    "E4",     # pycodestyle errors
    "E7",
    "E9",
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "B904",   # Allow `raise` without `from` inside `except`
    "ARG002", # Allow unused arguments in function definitions
    "T201",   # Allow print statements
    "N812",   # Lowercase imported as non-lowercase
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["T20", "ARG", "SIM"]  # Allow prints and unused args in tests
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"zang_model.py" = ["N806"]  # Allow uppercase variable names
"xu_model.py" = ["N806"]  # Allow uppercase variable names

[tool.ruff.lint.isort]
known-first-party = ["solar_irradiance"]
force-sort-within-sections = true
